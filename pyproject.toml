[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncx-tools"
version = "1.0.0"
description = "非同期タスク管理・同期/非同期変換ライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "tikisan", email = "s2501082@sendai-nct.jp" },
]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.12",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/tikipiya/asyncx"
Repository = "https://github.com/tikipiya/asyncx"
Issues = "https://github.com/tikipiya/asyncx/issues"
Changelog = "https://github.com/tikipiya/asyncx/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["asyncx*"]

[tool.setuptools.package-data]
asyncx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 5
addopts = [
  "--cov=asyncx",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["asyncx"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
branch = true
source = ["asyncx"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
